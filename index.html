<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jeopardy Board</title>
<style>
    body {
        background: #001f3f;
        font-family: Arial, sans-serif;
        color: white;
        text-align: center;
    }
    h1 { margin-top: 20px; }
    .board {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 5px;
        width: 90%;
        margin: 20px auto;
    }
    .tile {
        background: #003f7f;
        padding: 20px;
        font-size: 24px;
        font-weight: bold;
        cursor: pointer;
        border: 2px solid #fff;
    }
    .tile.used {
        background: #111;
        color: #444;
        cursor: default;
    }
    #popup {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.8);
        display: none;
        justify-content: center;
        align-items: center;
    }
    #popup-content {
        background: #003f7f;
        padding: 30px;
        border: 3px solid white;
        width: 60%;
        font-size: 28px;
    }
    #close-btn {
        margin-top: 20px;
        padding: 10px 20px;
        font-size: 20px;
        cursor: pointer;
    }
</style>
</head>
<body>

<h1>Jeopardy!</h1>

<div class="board" id="board"></div>

<div id="popup">
    <div id="popup-content">
        <div id="question"></div>
        <button id="close-btn">Close</button>
    </div>
</div>

<script>
const categories = [
    "Category 1",
    "Category 2",
    "Category 3",
    "Category 4",
    "Category 5",
    "Category 6"
];

const questions = {
    "Category 1": [
        "Question 1 for Cat 1",
        "Question 2 for Cat 1",
        "Question 3 for Cat 1",
        "Question 4 for Cat 1",
        "Question 5 for Cat 1"
    ],
    "Category 2": [
        "Question 1 for Cat 2",
        "Question 2 for Cat 2",
        "Question 3 for Cat 2",
        "Question 4 for Cat 2",
        "Question 5 for Cat 2"
    ],
    "Category 3": [
        "Question 1 for Cat 3",
        "Question 2 for Cat 3",
        "Question 3 for Cat 3",
        "Question 4 for Cat 3",
        "Question 5 for Cat 3"
    ],
    "Category 4": [
        "Question 1 for Cat 4",
        "Question 2 for Cat 4",
        "Question 3 for Cat 4",
        "Question 4 for Cat 4",
        "Question 5 for Cat 4"
    ],
    "Category 5": [
        "Question 1 for Cat 5",
        "Question 2 for Cat 5",
        "Question 3 for Cat 5",
        "Question 4 for Cat 5",
        "Question 5 for Cat 5"
    ],
    "Category 6": [
        "Question 1 for Cat 6",
        "Question 2 for Cat 6",
        "Question 3 for Cat 6",
        "Question 4 for Cat 6",
        "Question 5 for Cat 6"
    ]
};

const board = document.getElementById("board");
const popup = document.getElementById("popup");
const questionBox = document.getElementById("question");
const closeBtn = document.getElementById("close-btn");

function buildBoard() {
    categories.forEach(cat => {
        questions[cat].forEach((q, i) => {
            const tile = document.createElement("div");
            tile.className = "tile";
            tile.textContent = (i + 1) * 100;
            tile.onclick = () => showQuestion(tile, q);
            board.appendChild(tile);
        });
    });
}

function showQuestion(tile, q) {
    if (tile.classList.contains("used")) return;
    tile.classList.add("used");
    questionBox.textContent = q;
    popup.style.display = "flex";
}

closeBtn.onclick = () => {
    popup.style.display = "none";
};

buildBoard();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ERG Jeopardy – Modern Edition</title>
<style>
    :root {
        --light-green: #9be7a5;
        --dark-green: #2e7d32;
        --soft-red: #ff6f61;
        --orange: #ffb74d;
        --gold: #ffd54f;
        --bg: #001f3f;
        --tile-text: #003300;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        background: var(--bg);
        font-family: Arial, sans-serif;
        color: white;
        display: flex;
        flex-direction: column;
        height: 100vh;
    }
    header {
        padding: 10px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #000814;
    }
    header h1 {
        margin: 0;
        font-size: 28px;
    }
    header .controls {
        display: flex;
        gap: 10px;
        align-items: center;
    }
    button {
        border: none;
        padding: 8px 14px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
    }
    .btn-primary { background: var(--dark-green); color: #fff; }
    .btn-timer { background: var(--orange); color: #000; }
    .btn-final { background: var(--gold); color: #000; }
    .btn-small { font-size: 12px; padding: 4px 8px; }

    main {
        display: grid;
        grid-template-columns: 3fr 1.5fr;
        gap: 10px;
        padding: 10px 20px 20px;
        flex: 1;
        overflow: hidden;
    }

    /* Board */
    .board-wrapper {
        display: flex;
        flex-direction: column;
        height: 100%;
    }
    .categories-row {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 4px;
        margin-bottom: 6px;
    }
    .category {
        background: var(--dark-green);
        padding: 8px;
        text-align: center;
        font-weight: bold;
        font-size: 16px;
        border-radius: 4px;
    }
    .board {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        grid-auto-rows: 70px;
        gap: 4px;
        flex: 1;
    }
    .tile {
        background: var(--light-green);
        color: var(--tile-text);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        font-weight: bold;
        border-radius: 4px;
        cursor: pointer;
        box-shadow: 0 0 4px rgba(0,0,0,0.5);
        transition: transform 0.1s, box-shadow 0.1s;
    }
    .tile:hover {
        transform: translateY(-2px);
        box-shadow: 0 0 8px rgba(0,0,0,0.7);
    }

    /* Scoreboard */
    .scoreboard {
        background: #021526;
        border-radius: 6px;
        padding: 10px;
        display: flex;
        flex-direction: column;
        height: 100%;
    }
    .scoreboard h2 {
        margin: 0 0 8px;
        font-size: 20px;
    }
    .team-list {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 10px;
    }
    .team {
        background: #031d34;
        border-radius: 6px;
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 4px;
    }
    .team-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 6px;
    }
    .team-header input {
        flex: 1;
        padding: 4px 6px;
        border-radius: 4px;
        border: 1px solid #555;
        background: #000;
        color: #fff;
    }
    .team-score {
        font-weight: bold;
        font-size: 16px;
    }

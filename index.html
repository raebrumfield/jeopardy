<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jeopardy Board</title>
<style>
    body {
        background: #001f3f;
        font-family: Arial, sans-serif;
        color: white;
        text-align: center;
    }
    h1 { margin-top: 20px; }
    .board {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 5px;
        width: 90%;
        margin: 20px auto;
    }
    .tile {
        background: #003f7f;
        padding: 20px;
        font-size: 24px;
        font-weight: bold;
        cursor: pointer;
        border: 2px solid #fff;
    }
    .tile.used {
        background: #111;
        color: #444;
        cursor: default;
    }
    #popup {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.8);
        display: none;
        justify-content: center;
        align-items: center;
    }
    #popup-content {
        background: #003f7f;
        padding: 30px;
        border: 3px solid white;
        width: 60%;
        font-size: 28px;
    }
    #close-btn {
        margin-top: 20px;
        padding: 10px 20px;
        font-size: 20px;
        cursor: pointer;
    }
    #final-btn {
        margin-top: 30px;
        padding: 15px 30px;
        font-size: 26px;
        background: gold;
        color: black;
        border: 3px solid white;
        cursor: pointer;
    }
</style>
</head>
<body>

<h1>Jeopardy!</h1>

<div class="board" id="board"></div>

<button id="final-btn">Final Jeopardy – Academy Awards</button>
